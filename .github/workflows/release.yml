name: Release

# 릴리스를 만든다. v로 시작하는 태그(예: v1.0)를 올리거나,
# Actions에서 직접 실행하며 태그 이름을 넣으면 현재 커밋에 그 태그를 붙여 만든다.
# 릴리스 설명은 .github/release-notes/<태그>.md, 없으면 자동 생성.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '만들 태그 (예: v1.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          notes=".github/release-notes/${TAG}.md"
          if [ -f "$notes" ]; then set -- --notes-file "$notes"; else set -- --generate-notes; fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "알약찾기 $TAG" "$@"
