name: Release

# v로 시작하는 태그(예: v1.0)를 올리면 GitHub 릴리스를 만든다.
# 릴리스 설명은 .github/release-notes/<태그>.md, 없으면 자동 생성.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          notes=".github/release-notes/${TAG}.md"
          if [ -f "$notes" ]; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "알약찾기 $TAG" --notes-file "$notes"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "알약찾기 $TAG" --generate-notes
          fi
